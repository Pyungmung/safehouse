spring.application.name=safehouse

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/safehouse
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Naver Mail SMTP
spring.mail.host=smtp.naver.com
spring.mail.port=465

# Naver Mail Account
spring.mail.username=${NAVER_ID}
spring.mail.password=${NAVER_APP_PASSWORD}

# SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# JWT
jwt.secret=${JWT_SECRET}

# Naver Login
naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}
naver.redirect-uri=http://safehouse:8080/api/naver/callback